# The input layer: has the feed changed its mind?
#
# *** THIS CATCHES THE CLASS THAT POISONS EVERYTHING DOWNSTREAM. ***
# A column whose NAME, TYPE and ROW COUNT all held steady while its CONTENT changed kind passes
# every schema test and every volume monitor ever written. A `region` column that starts carrying
# city names, a `channel` that switches from names to codes, a feed that quietly changes unit.
#
# Half of this family is CODE and is not asked: a numeric profile spiking at -9999, or a date whose
# maximum sits years in the future, is a sentinel found by counting. Only meaning is asked.
version: 1

field_matches_its_name:
  id_prefix: "name"
  type: choice
  prompt_version: "feed.name.v2"
  instructions:
    question: >-
      Do the values in `sample` look like what a column called `column` should hold in a table
      called `relation`?
    note: >-
      The sample is a handful of real values. Judge the KIND of thing they are, not whether any one
      of them is correct.
  criteria:
    matches:
      what: "The values are the kind of thing the name promises."
    holds_something_else:
      what: "The values are consistently a DIFFERENT kind of thing from what the name says."
      examples: ["a column called county holding city names",
                 "a column called status holding numeric codes",
                 "a column called date holding free text"]
    mixed:
      what: "Some values match the name and others are a different kind entirely."
      examples: ["ids in some rows and names in others, from two merged feeds"]
    cannot_tell:
      what: "The sample does not settle it. Choose this rather than guess."

units_are_what_the_column_claims:
  id_prefix: "unit"
  type: choice
  prompt_version: "feed.units.v4"
  # *** v1 ASKED WHETHER THE MAGNITUDES WERE PLAUSIBLE, AND JEV CANNOT DO THAT. ***
  # Verified against real values: it called 218,235 "acres" CONSISTENT at 0.82 and 4,073,925
  # "acre-feet" CONSISTENT at 0.54 -- wrong by 43,560x and 325,851x. TypeSafe publish the reason:
  # the model cannot reliably judge whether two values are near each other. The instructions held
  # no arithmetic word, so the calculator rule missed it and a `numeric_magnitude` rule now exists.
  #
  # So it asks what it CAN answer: what unit the NAME claims. That is language, and the sibling
  # family that does the same job for names measured 0.92 to 0.99 on real columns. Comparing an
  # observed range against that unit is arithmetic, and arithmetic is code's.
  instructions:
    question: >-
      What unit does the NAME of `column` claim its values are in? Judge the name and any
      documentation only. Do not judge whether the sample values are the right size for it; that
      is checked separately.
    note: >-
      Answer `no_unit_implied` whenever the name promises nothing about units. Most columns do not.
  criteria:
    acres:
      what: "The name claims acres."
      examples: ["land_acres", "lot_acres", "acreage"]
    square_feet:
      what: "The name claims square feet."
      examples: ["land_sqft", "building_area_sf", "footprint_square_feet"]
    acre_feet:
      what: "The name claims acre-feet."
      examples: ["volume_acre_feet", "storage_af", "allocation_acreft"]
    gallons:
      what: "The name claims gallons."
      examples: ["volume_gallons", "daily_gal"]
    cubic_feet_per_second:
      what: "The name claims cfs, a rate of flow."
      examples: ["flow_cfs", "discharge_cubic_feet_per_second"]
    gallons_per_minute:
      what: "The name claims gpm, a rate of flow."
      examples: ["pump_gpm", "yield_gallons_per_minute"]
    feet:
      what: "The name claims feet, as a depth, height or length."
      examples: ["depth_ft", "elevation_feet", "ceiling_height_feet"]
    miles:
      what: "The name claims miles."
      examples: ["route_length_miles", "distance_mi"]
    meters:
      what: "The name claims meters."
      examples: ["depth_m", "elevation_meters"]
    currency:
      what: "The name claims a currency amount."
      examples: ["sale_price_usd", "assessed_value", "cost_dollars"]
    days:
      what: "The name claims a number of days."
      examples: ["days_since_issued", "age_days"]
    no_unit_implied:
      what: >-
        The name promises no unit at all. A count, an identifier, a code, a flag, a name, a date,
        or a measurement whose name does not say what it is measured in.
      examples: ["order_id", "county", "n_records", "is_completed", "amount", "value"]
    cannot_tell:
      what: "The name is too abbreviated or ambiguous to say which unit it claims."
