# Two families that read MEANING out of things no parser can settle.
version: 1

# *** WHY THIS IS WORTH ASKING AT ALL. ***
# A `where` clause is either domain logic that must be preserved, a patch over a bad feed that
# should be fixed upstream, or the thing that makes the model mean what it means. Those are
# completely different objects and the SQL is identical for all three. Nothing else in a warehouse
# tells them apart, and the cost of confusing them is deleting a rule or keeping a hack for years.
predicate_intent:
  id_prefix: "pred"
  type: choice
  prompt_version: "pred.v1"
  instructions:
    question: >-
      Why is the filter in `predicate` here? Judge only this one condition; the model's other
      filters are given as context.
    note: >-
      `model_purpose` is what the author wrote about this model, when they wrote anything. Weigh it,
      but the SQL is what runs.
  criteria:
    business_rule:
      what: "Domain logic. The world works this way and the filter encodes it."
      not_for: "A filter that exists because the incoming data is unreliable."
      examples: ["only rights whose structure still exists",
                 "exclude filings that were withdrawn"]
    data_quality_workaround:
      what: >-
        The feed is wrong or dirty and this patches around it. The real fix is upstream, and the
        filter will quietly go stale when the feed improves.
      examples: ["where name is not null and trim(name) <> ''",
                 "excluding a sentinel the source writes instead of NULL",
                 "dropping rows a known-broken load produced"]
    scope_limit:
      what: >-
        It defines what this model is ABOUT. Removing it would not fix anything; it would make a
        different model.
      examples: ["where state = 'CO'", "where division = 1", "only commercial parcels"]
    performance_prefilter:
      what: >-
        Narrowing purely to make the query cheaper, where a later step does the exact test anyway.
      examples: ["a bounding box before an exact distance test"]
    cannot_tell:
      what: "The state does not distinguish these. Choose this rather than guess."

# *** DESCRIPTIONS ROT, AND NOTHING NOTICES. ***
# A description is written once and the SQL changes forty times. Phrased as the DEFECT, so a high
# probability means the prose is wrong -- mixing polarity across a bank is how a threshold gets
# applied backwards.
# *** EXTRACTION IS SELECTION. THE MODEL NEVER WRITES A CLAIM. ***
# Jev is not trained to generate and does badly when forced to, so code splits the prose and this
# decides what KIND of sentence each one is. Prose in a warehouse is mostly NOT claims: it is
# rationale, incident history, and instructions to whoever reads it next. Treating an incident note
# as a claim about today's code is how a findings list fills up with the past.
sentence_is_a_claim:
  id_prefix: "sentence"
  type: choice
  prompt_version: "sentence.v1"
  instructions:
    question: >-
      Each sentence in `sentences_under_judgement` was written in this model's documentation. For
      the one named in the question id, what job is that sentence doing?
    note: >-
      Judge the sentence as written. A sentence can be true and still not be a claim about what
      this model produces.
  criteria:
    claim_about_output:
      what: >-
        It asserts something checkable about what this model produces -- its grain, its filters,
        which rows it keeps or drops, what a column contains or means.
      examples: ["one row per water division and case number",
                 "residential permits are filtered out",
                 "amount is in acre-feet, never gallons"]
    claim_about_a_rule:
      what: >-
        It asserts that the model follows a rule from somewhere outside this project -- a statute,
        a spec, a standard, a policy -- whether or not it names the source.
      examples: ["the deadline is the last day of the second month following the filing month",
                 "per C.R.S. 37-92-302(1)(c), objections close two months after filing"]
    rationale:
      what: >-
        It explains WHY the code is the way it is, without asserting what the code does.
      examples: ["a degree of longitude compresses by cos(latitude), so metres matter here",
                 "this is cheaper than the obvious join"]
    incident_or_history:
      what: >-
        It records something that WAS true, was found, or was fixed. It is about the past, not
        about what the code does now.
      examples: ["B-sweep found 53 dateless Peoria permits",
                 "this used to group by year and silently split entities"]
    instruction_to_maintainers:
      what: "It tells whoever reads it next what to do or not do. A TODO, a warning, a pointer."
      examples: ["do not add a filter here without checking the crosswalk",
                 "see docs/water_law.md before changing this"]
    not_a_statement:
      what: "A heading, a fragment, a label, or anything with no assertion in it at all."

# *** A NOUL HAD NOWHERE TO PUT "THE CODE NEITHER DOES NOR CONTRADICTS THIS". ***
# The family shipped as a noul, so a description the code simply does not speak to arrived as a
# CONTRADICTION. That is why boilerplate flagged: "Staging model: light cleanup of one raw source"
# is not false, it is silent, and a yes/no question forced silence into the wrong bucket. A
# repetition heuristic was added to work around it, which is a workaround for a missing option.
#
# TypeSafe's citation_check cookbook is this exact shape one level down: supports / contradicts /
# says_nothing. The third option is the one that matters.
claim_alignment:
  id_prefix: "claim"
  # Dogfooding the escape hatch: `contradicts` names `says_nothing` to push silence away from
  # itself, which IS the routing the lint warns about. Kept because it was measured, not assumed:
  # adding that sentence took contradictions from 8 to 5 on a real slice while says_nothing rose
  # from 8 to 14, and a hand-verified false positive disappeared. The field's warning stands --
  # the answering model may not honour a routing sentence -- and here it demonstrably did.
  acknowledge:
    option_routes_to_another: >-
      measured: naming says_nothing inside contradicts moved a real slice from 8 contradictions to
      5 and removed a hand-verified false positive. Re-measure before removing it.
  type: choice
  prompt_version: "claim.v2"
  instructions:
    question: >-
      `claim` is something this project's documentation asserts about the model. `evidence` is what
      the model's code actually does. Does the evidence support the claim, contradict it, or not
      speak to it at all?
    note: >-
      Judge ONLY the claim given. Evidence that is silent is not evidence against: a claim about
      one column is not contradicted by the model also emitting others, and a claim that is terse
      is not thereby wrong.
  criteria:
    supports:
      what: "The evidence does what the claim says, or directly entails it."
      examples: ["claim says one row per section, and the model groups by section alone",
                 "claim says withdrawn filings are excluded, and a filter excludes them"]
    contradicts:
      what: >-
        The evidence positively disagrees: it does something the claim rules out, or omits
        something the claim requires and the evidence WOULD have shown. Never choose this merely
        because the evidence is silent -- that is `says_nothing`.
      examples: ["claim says one row per section, and the model groups by section AND year",
                 "claim says residential is filtered out, and the filter excludes two spellings",
                 "claim describes a column the model no longer produces"]
    says_nothing:
      what: >-
        The evidence does not reach the claim. This includes a claim about what VALUES a column
        holds when the evidence shows only that the column exists, a claim about data the SQL
        cannot show, a claim about something outside this model, and a claim too general for any
        filter or column to bear on. Prefer this over `contradicts` whenever the evidence is
        merely absent: absence is not disagreement.
      examples: ["claim says a column holds readable names, and the evidence shows the column is
                  read but shows none of its values",
                 "claim is 'light cleanup of one raw source', which no filter confirms or denies",
                 "claim is about a downstream consumer rather than about this model's output",
                 "claim describes what an upstream system writes, which this SQL cannot witness"]
    cannot_tell:
      what: "The claim is too vague to check against any evidence, or the evidence is unreadable."

description_contradicts_the_code:
  id_prefix: "desc"
  type: noul
  prompt_version: "desc.v1"
  instructions:
    question: >-
      Does the documentation -- `description` and `documentation_in_the_file` together -- assert
      something about this model that the code in `contract` and `filters` does not do?
    note: >-
      Judge CONTRADICTION, not completeness. A summary is not a contradiction of the thing it
      summarises: prose that is brief, or silent about some column, or that describes the model's
      main purpose while the model also emits supporting columns, is NOT wrong. Say yes only if
      something the documentation claims is not true of the code.
  criteria:
    "true":
      what: "The description states something the code does not do, or states the opposite."
      examples: ["says one row per section where the model groups by section and year",
                 "says it excludes withdrawn filings where no such filter exists",
                 "describes a column the model no longer produces"]
    "false":
      what: >-
        Everything the description claims is true of the code. It may be incomplete, terse, or
        silent about details; that is not a contradiction.
