# Volume, joined to what the project says about itself.
#
# *** NEITHER TOOL PRODUCES THIS SENTENCE ALONE. ***
# Elementary detects with no semantics: "row count fell 41%". It does not know the model's declared
# grain, it has not read the project's own prose, and it cannot see the DAG. assay has all three
# and has never tracked a row count over time. The join is the whole point, and it is why this is
# ONE question rather than a re-implementation of anomaly detection.
#
# *** THE QUESTION IS NOT "IS THIS ANOMALY REAL". ***
# Counting settled that before anything was asked. The question is whether the movement
# CONTRADICTS a sentence this project wrote about itself -- which needs the claim, the grain and
# the movement in one state, and is exactly the shape the claim families already handle.
version: 1

volume_contradicts_a_claim:
  id_prefix: "volume"
  type: choice
  prompt_version: "volume.v1"
  subject: model
  instructions:
    question: >-
      This table's row count moved between two observations. The project makes the claim below
      about this model, in its own documentation or comments. Does the movement contradict the
      claim?
    note: >-
      `movement` was COUNTED, not judged -- treat it as fact. Judge only whether the claim and
      the movement can both be true. A claim that says nothing about how many rows there are
      cannot be contradicted by a change in how many rows there are.
  criteria:
    contradicts_the_claim:
      what: >-
        The claim asserts something the movement makes false -- completeness, a fixed set, a
        guaranteed grain, or a volume the number now disagrees with.
      examples:
        - "the claim says it holds the FULL set of something and the count fell by half"
        - "the claim says one row per entity and the count is now larger than that entity's table"
        - "the claim names a fixed set of categories and the count trebled"
    the_claim_survives_the_movement:
      what: >-
        Both can be true at once. The claim is about shape, meaning or provenance rather than
        about how many rows there are, or the movement is the size the claim would predict.
      examples:
        - "the claim describes what one row IS, and rows were added"
        - "the claim says it is refreshed weekly, and this is a weekly refresh"
    the_claim_says_nothing_about_volume:
      what: >-
        The claim and the movement are about different things entirely, so there is nothing to
        contradict. NOT the same as the claim surviving a movement it speaks to.
      examples:
        - "the claim documents a column's units"
        - "the claim names the upstream source"
    cannot_tell_from_this:
      what: >-
        The claim is too vague to be contradicted, or deciding needs something not in this state.
        Say this rather than guessing -- an unresolved answer is a question for a person.
  # The whole reason this family exists as a DECLARATION rather than a function: `check` builds
  # the finding from this list, through the generic producer shipped in 0.38.0.
  finding_when: ["contradicts_the_claim"]

# *** THE MONITORING BANK: FOUR PILES OF COUNTS, EACH SORTED BY A JUDGMENT. ***
# Asked by `assay volume --judge` from what Elementary already counted. Each judges the
# MONITORING -- whether a movement, a gap, a stale monitor or a silent test matters -- and never
# the data, which stays Elementary's.

movement_is_expected_for_this_kind_of_table:
  id_prefix: "mvmt"
  type: choice
  prompt_version: "movement.v1"
  finding_when: [unexpected_for_this_kind]
  instructions:
    question: >-
      `model`'s arrivals moved by `arrivals_per_bucket.change_percent`. Given what kind of table
      this is -- its layer, what it reads, how it is built and what it describes -- is a movement
      like this routine for it?
    note: >-
      An append-only feed, a backfill or an event log moves a lot on an ordinary day. A reference
      table, a dimension of fixed entities or a model rebuilt from a stable source should barely
      move, so the same percentage there means something upstream changed. Judge the kind of
      table, not the size of the number.
  criteria:
    routine_for_this_kind:
      what: "Tables of this kind move like this in normal operation: feeds, logs, backfills."
    unexpected_for_this_kind:
      what: >-
        This kind of table should be stable, so a movement like this means an upstream change
        somebody should look at.
    cannot_tell:
      what: "The state does not settle it. Choose this rather than guess."

monitor_covers_what_matters:
  id_prefix: "mcov"
  type: choice
  prompt_version: "coverage.v2"
  finding_when: [worth_watching]
  # Asked once per SOURCE (U2): whether a model is watched is a lookup in the manifest, so only a
  # source with no row-count monitor that reaches a mart is asked about. The answer is the reading
  # on that source's `source_volume_not_monitored` finding, never a finding of its own.
  asked_about: source
  instructions:
    question: >-
      `source` feeds `marts_downstream` marts and nothing counts its rows: no volume monitor on
      it, and none on any model between it and those marts. Given what it is, is it worth
      watching?
    note: >-
      Nobody monitors every source, so the useful answer is which ones. A feed loaded from
      outside this project, whose row count can move on its own, is worth watching. A fixed
      reference list that is loaded once, or only changes when somebody edits it, does not move.
  criteria:
    worth_watching:
      what: >-
        Its row count can change for reasons outside this project. If it stopped arriving or
        doubled, the marts would be wrong and nothing would fail to say so.
    static:
      what: >-
        It is a fixed list or a one-time load: its row count does not change unless somebody
        changes it on purpose.
    cannot_tell:
      what: "The state does not settle it. Choose this rather than guess."

stale_monitor_still_matters:
  id_prefix: "mstl"
  type: choice
  prompt_version: "stale.v1"
  finding_when: [still_matters]
  instructions:
    question: >-
      A `monitor` on `model` last FAILED and has not run since. Given what the model is and what
      reads it now, is that failure still something somebody needs to deal with?
    note: >-
      A stale failure reads as a live one in every status view. It still matters when the model
      is built and marts read it. It is archaeology when the model feeds nothing now, or the
      monitor was on a column or a shape that no longer exists.
  criteria:
    still_matters:
      what: "The model is live and read downstream; the failure is an alert nobody has answered."
    archaeology:
      what: "Nothing that matters reads this now, or the monitored thing is gone. Clear it."
    cannot_tell:
      what: "The state does not settle it. Choose this rather than guess."

test_never_ran_is_a_gap_or_a_leftover:
  id_prefix: "tnvr"
  type: choice
  prompt_version: "neverran.v1"
  finding_when: [a_coverage_gap]
  instructions:
    question: >-
      `test` is declared on `model` and has never produced a result. Is that a hole in coverage
      somebody should close, or a leftover on something that no longer builds or matters?
    note: >-
      A test on a live model that marts read, which has never once run, protects nothing while
      reading as coverage. A test on a model nothing reads, or on one that is disabled or
      replaced, is a leftover to delete. The two want opposite responses.
  criteria:
    a_coverage_gap:
      what: "The model is live and read downstream, and the test should be running."
    a_leftover:
      what: "The model feeds nothing that matters, or the test belongs to something replaced."
    cannot_tell:
      what: "The state does not settle it. Choose this rather than guess."
