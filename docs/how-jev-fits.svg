<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 566" width="980" height="566"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .lbl   { font-size: 13px; fill: #8b949e; }
    .head  { font-size: 15px; font-weight: 700; }
    .body  { font-size: 12.5px; fill: #768390; }
    .tiny  { font-size: 11.5px; fill: #6e7781; }
    .code  { font-size: 12px; fill: #58a6ff; }
    .box   { fill: none; stroke-width: 1.5; rx: 8; }
    .arrow { stroke: #6e7781; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
  </defs>

  <!-- An explicit background: GitHub serves SVG on white in light mode, and a diagram that
       inverts under the reader is a diagram nobody trusts. -->
  <rect width="980" height="566" fill="#22272e"/>

  <!-- ─────────── source -->
  <rect class="box" x="30" y="24" width="920" height="58" stroke="#484f58"/>
  <text class="head" x="50" y="50" fill="#adbac7">your dbt project</text>
  <text class="body" x="50" y="70">manifest.json · compiled SQL · schema.yml · catalog.json · and, when you let it, the warehouse itself</text>

  <path class="arrow" d="M 490 82 L 490 116" marker-end="url(#a)"/>

  <!-- ─────────── code layer -->
  <rect class="box" x="30" y="118" width="920" height="104" stroke="#3fb950"/>
  <text class="head" x="50" y="144" fill="#3fb950">1 · what a parser can settle, it settles</text>
  <text class="body" x="50" y="166">sqlglot walks the AST. grain proposals · column provenance · per-edge lineage · blast radius</text>
  <text class="body" x="50" y="185">tests that cannot fail · arbitrary picks · degrees-as-distance · dialect traps · fan-out joins</text>
  <text class="tiny" x="50" y="207">Exact, free, and never asked of a model. If a parser can answer it, Jev is never asked.</text>

  <path class="arrow" d="M 490 222 L 490 262" marker-end="url(#a)"/>
  <text class="tiny" x="505" y="248">…and everything left over is a question about MEANING</text>

  <!-- ─────────── jev layer -->
  <rect class="box" x="30" y="264" width="920" height="150" stroke="#a371f7"/>
  <text class="head" x="50" y="290" fill="#a371f7">2 · Jev answers what the code cannot</text>
  <text class="body" x="50" y="312">A typed judgment, not JSON you hope parses. It cannot return anything outside what you asked.</text>

  <rect class="box" x="50" y="326" width="272" height="70" stroke="#4c3a6b"/>
  <text class="code" x="64" y="346">choice</text>
  <text class="tiny" x="64" y="364">one of a defined set, + the full</text>
  <text class="tiny" x="64" y="380">distribution. always a no-match option.</text>

  <rect class="box" x="338" y="326" width="272" height="70" stroke="#4c3a6b"/>
  <text class="code" x="352" y="346">noul</text>
  <text class="tiny" x="352" y="364">probability a condition holds.</text>
  <text class="tiny" x="352" y="380">0.5 means genuinely unsure, not "weak yes".</text>

  <rect class="box" x="626" y="326" width="272" height="70" stroke="#4c3a6b"/>
  <text class="code" x="640" y="346">score</text>
  <text class="tiny" x="640" y="364">position on ordered levels, each</text>
  <text class="tiny" x="640" y="380">naming a concrete situation.</text>

  <path class="arrow" d="M 490 414 L 490 450" marker-end="url(#a)"/>

  <!-- ─────────── human layer -->
  <rect class="box" x="30" y="452" width="448" height="88" stroke="#d29922"/>
  <text class="head" x="50" y="478" fill="#d29922">3 · you rule on it</text>
  <text class="body" x="50" y="500">assay review -i</text>
  <text class="tiny" x="50" y="520">a agree, d disagree, u unclear. Least certain first.</text>
  <text class="tiny" x="50" y="535">Nothing fails a build before you have ruled. Refused in code.</text>

  <rect class="box" x="502" y="452" width="448" height="88" stroke="#539bf5"/>
  <text class="head" x="522" y="478" fill="#539bf5">4 · it lands in the warehouse</text>
  <text class="body" x="522" y="500">assay export, then dbt seed</text>
  <text class="tiny" x="522" y="520">Relations your own models can join to. Every row says</text>
  <text class="tiny" x="522" y="535">declared, observed, derived or judged, with its probability.</text>
</svg>
