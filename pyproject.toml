[project]
name = "dbt-assay"
version = "0.0.1"
description = "Recover the semantics your warehouse never wrote down. sqlglot for structure, TypeSafe's Jev for meaning."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Ryan Christensen", email = "ryan@sunnydata.co" }]
keywords = ["dbt", "sqlglot", "data-quality", "lineage", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Database",
]

# DELIBERATELY NOT dbt-core. This reads manifest.json as data.
# dbt-core pins adapters, Python versions and dependencies aggressively; depending on it means
# fighting every user's environment and breaking on every dbt release. Reading the JSON means
# assay works across dbt versions and adapters, and can never break someone's dbt.
dependencies = [
  "sqlglot>=25",
  "duckdb>=1.0",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
jev = ["httpx>=0.27"]
mcp = [
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/ryanchristensen/dbt-assay"

# The package is dbt-assay (discoverable); the command is `assay` (short to type).
[project.scripts]
assay = "dbt_assay.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_assay"]

# The question bank is DATA and must ship inside the wheel: a user has to be able to read
# what assay asks, and contracts.py loads it at import time.
[tool.hatch.build.targets.wheel.force-include]
"src/dbt_assay/questions" = "dbt_assay/questions"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
