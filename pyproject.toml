[project]
name = "dbt-assay"
version = "0.35.0"
description = "Recover the semantics your warehouse never wrote down. sqlglot for structure, TypeSafe's Jev for meaning."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Ryan Christensen", email = "ryan@sunnydata.co" }]
keywords = ["dbt", "sqlglot", "data-quality", "lineage", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Database",
]

# DELIBERATELY NOT dbt-core. This reads manifest.json as data.
# dbt-core pins adapters, Python versions and dependencies aggressively; depending on it means
# fighting every user's environment and breaking on every dbt release. Reading the JSON means
# assay works across dbt versions and adapters, and can never break someone's dbt.
dependencies = [
  # 28 is the real floor: `exp.RegexpFullMatch` does not exist before it, and the
  # declared >=25 was a claim of support assay did not have. CI tests the floor
  # and the latest on every push, because both of sqlglot's recent renames failed
  # QUIETLY rather than loudly.
  "sqlglot>=28",
  "duckdb>=1.0",
  "typer>=0.12",
  # *** typer 0.27 STOPPED DEPENDING ON click. ***
  #  reads a single keypress through click, and that import was undeclared, so
  # the only path by which a question reaches its gate died for anyone on a current typer.
  "click>=8.0",
  "rich>=13",
  "pyyaml>=6",
  "httpx>=0.28.1",
  "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
jev = ["httpx>=0.27"]
mcp = [
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/ryanchristensen/dbt-assay"

# The package is dbt-assay (discoverable); the command is `assay` (short to type).
[project.scripts]
assay = "dbt_assay.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_assay"]

# The question bank is DATA and must ship inside the wheel: a user has to be able to read what
# assay asks, and contracts.py loads it at import time. It needs no force-include -- it already
# lives inside the package directory, and adding one makes hatchling add every file TWICE and
# refuse to build. tests/test_packaging.py asserts the banks load from wherever assay is
# installed, and CI asserts they are present in the wheel itself.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
