name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --all-extras --python ${{ matrix.python }}
      # The whole suite runs offline. No API key is configured here ON PURPOSE: a test that
      # needs one is a test that cannot run in CI, and the judgment tier is opt-in by design.
      - run: uv run --python ${{ matrix.python }} pytest -q

  # *** EIGHT VERSIONS WERE BUMPED AND NEVER TAGGED, AND NOTHING SAID SO. ***
  # The release is tag-driven, so bumping `__version__` and pushing felt like releasing and
  # published nothing. 0.25 through 0.45 exist as commits and as nothing else. PyPI only shows the
  # LAST successful upload, so the gap is invisible from the outside until somebody looks -- which
  # is the shape this whole project exists to find: a thing that stopped happening, reported the
  # same way as a thing that is fine.
  #
  # On main only: a version sitting on main with no tag is a version nobody can install.
  released:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: the version on main is tagged
        run: |
          VER=$(uv run python -c "import dbt_assay; print(dbt_assay.__version__)")
          git fetch --tags --quiet
          if git rev-parse "v$VER" >/dev/null 2>&1; then
            echo "v$VER is tagged."
          else
            echo "::error::main is on $VER and there is no v$VER tag, so nothing published it."
            echo "::error::Release with: scripts/release.sh"
            exit 1
          fi

  # *** 81 KB OF INVALID JAVASCRIPT SHIPPED, AND EVERY TEST PASSED. ***
  # One eaten quote killed the whole script. The page still rendered -- correct HTML, correct
  # counts, every tab dead on click -- because nothing in the suite RAN the thing it ships. The
  # checks all inspected what the page contains. `node --check` finds it in ten seconds.
  page-executes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: uv sync --all-extras
      - name: every script the page ships is valid javascript
        run: uv run pytest tests/test_the_page_is_executable.py -q

  # *** AND PARSING IS NOT RUNNING. ***
  # A page can parse, load, and throw on the first click -- which is what a list where a dict was
  # expected did to the chain tab: 573 hops rendering as a blank pane with nothing failing. This
  # opens the real file in a real browser, clicks every tab, and asserts no page error and no
  # empty pane.
  page-runs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run playwright install --with-deps chromium
      - name: the page loads, every tab fills, and nothing throws
        run: uv run pytest tests/test_the_page_runs_in_a_browser.py -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      # The shipped banks are hand-tuned and measured. If the linter nags about
      # them, one of the two is wrong and it must be settled before release.
      - run: uv run assay banks --strict

  dependency-majors:
    # *** THE JOB THAT EARNS ITS KEEP. ***
    # sqlglot renamed a Select's `from` arg to `from_` at v30, and the MCP SDK renamed FastMCP to
    # MCPServer at v2. Both changes fail QUIETLY: the first makes a FROM relation simply vanish, so
    # every check behaves as though the model joined nothing. Testing the declared floor as well as
    # the latest is what stops assay claiming support it does not have.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlglot-floor
            pin: "sqlglot==28.0.0"
          - name: sqlglot-latest
            pin: "sqlglot"
          - name: mcp-v1
            pin: "mcp<2"
          - name: mcp-v2
            pin: "mcp>=2"
    name: deps (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv pip install --upgrade "${{ matrix.pin }}"
      - run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      # The question banks are DATA. A packaging mistake ships a tool whose bank is empty, which
      # fails at import rather than at install, so the wheel's contents are asserted here.
      - name: the wheel carries the question banks
        run: |
          python -m zipfile -l dist/*.whl | grep -E 'dbt_assay/questions/.*\.yml' || {
            echo "::error::the question banks are missing from the wheel"; exit 1; }
      - name: it installs clean and the banks load
        run: |
          uv venv /tmp/v && uv pip install --python /tmp/v/bin/python dist/*.whl
          /tmp/v/bin/python -c "
          from dbt_assay.contracts import load_all_banks
          b = load_all_banks()
          assert len(b) >= 12, b
          print('banks loaded from the installed wheel:', len(b))
          "
          /tmp/v/bin/assay --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run --with pip-audit pip-audit --strict || true
