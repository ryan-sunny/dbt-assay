name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # *** TRUSTED PUBLISHING: NO LONG-LIVED TOKEN EXISTS TO LEAK. ***
      # PyPI mints a short-lived credential from this job's OIDC identity. There is no secret in
      # the repository, nothing to rotate, and nothing an attacker can steal from a fork.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: the tag and the package version agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(uv run python -c "import dbt_assay; print(dbt_assay.__version__)")
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != version $VER"; exit 1; }
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
